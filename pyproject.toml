[project]
name = "vertexui"
version = "1.9.2"
description = "A UI toolkit for Dear ImGui built to make tools that do not look alike: whole-identity profiles, six layouts, slot/module composition, drawn data graphics, synthesised sound and click-through toasts."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
keywords = ["imgui", "gui", "ui", "toolkit", "dark-theme", "desktop",
            "shader", "glsl", "particles", "notifications", "dataviz",
            "sparkline", "composition", "theming", "table", "forms",
            "i18n", "icons", "skins", "themes"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: User Interfaces",
    "Environment :: Win32 (MS Windows)",
]
dependencies = ["imgui-bundle", "numpy"]

[project.optional-dependencies]
# toasts composite their surface with OpenCV; nothing else needs it
toasts = ["opencv-python"]
# the shader backdrop is the only thing that talks to GL directly
backdrop = ["PyOpenGL"]
all = ["opencv-python", "PyOpenGL"]

[project.urls]
Homepage = "https://github.com/D4ead3ye/vertexui"
Issues = "https://github.com/D4ead3ye/vertexui/issues"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["vertexui"]
